[package]
name = "camera-rs"
version = "0.1.0"
edition = "2021"

[features]
default = ["esp32s3"]
esp32s3 = []

[dependencies]
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp"] }
embassy-time = { version = "0.5.0", features = ["generic-queue-8"] }
embedded-io-async = "0.7.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.14", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"] }
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.11", features = ["esp32s3", "log"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "wifi", "log-04"] }
esp-rtos = { version = "0.3.0", features = ["esp32s3", "esp-radio", "embassy", "log-04"] }
static_cell = "2.1.0"

[profile.release]
opt-level = "s"       # Оптимизация по размеру вместо максимальной скорости
lto = false           # Отключаем LTO, чтобы избежать проблем с Xtensa
panic = "abort"       # Убирает механизм unwind, экономит место