[package]
name = "camera-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
# base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# embedded-hal = "1.0.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = "0.5.0"
esp-hal = { version = "1.1.2", features = ["log-04", "unstable" ] }
esp-println = { version = "0.17.0", features = ["log-04"] }
# static_cell = "2.1.0"

[features]
unstable = []

esp32s3 = [
    "esp-backtrace/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-println/esp32s3",
]

[profile.release]
debug            = 2
debug-assertions = true
# opt-level        = 3
lto              = "fat"
# panic            = "abort"
codegen-units    = 1