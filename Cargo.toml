[package]
name = "camera-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
embedded-hal = "=1.0.0"
esp-alloc = "=0.10.0"
esp-backtrace = { version = "=0.19.0", features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = "=0.5.0"
esp-hal = { version = "=1.1.2", features = ["unstable", "log-04"] }
esp-println = { version = "=0.17.0", features = ["log-04"] }

[features]
default = ["esp32s3"]

esp32 = [
    "esp-backtrace/esp32",
    "esp-bootloader-esp-idf/esp32",
    "esp-hal/esp32",
    "esp-println/esp32",
]
esp32s3 = [
    "esp-backtrace/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-println/esp32s3",
]

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
panic = "abort"
codegen-units = 1
debug = false